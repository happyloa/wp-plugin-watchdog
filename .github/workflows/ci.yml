name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run PHPCS
        if: matrix.php-version == '8.5'
        run: vendor/bin/phpcs
      - name: Run PHPUnit
        run: vendor/bin/phpunit

  package:
    name: Build release package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build WordPress release ZIP
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version 1.8.2
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: site-add-on-watchdog-1.8.2
          path: dist/site-add-on-watchdog-1.8.2.zip
          if-no-files-found: error

  plugin-check:
    name: WordPress Plugin Check
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: site-add-on-watchdog-1.8.2
          path: dist
      - name: Extract release package
        run: unzip -q dist/site-add-on-watchdog-1.8.2.zip -d dist/plugin-check
      - name: Run official WordPress checks
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/plugin-check/site-add-on-watchdog
          strict: true
          include-experimental: false
      - name: Verify WordPress version and packaged scan
        run: |
          wp-env run cli wp eval 'if (get_bloginfo("version") !== "7.1") { WP_CLI::error("Expected WordPress 7.1 for compatibility verification."); }'
          wp-env run cli wp watchdog scan --notify=false
          wp-env run cli wp eval 'if (get_transient("siteadwa_scan_error") || ! get_option("siteadwa_risk_history")) { WP_CLI::error("The scan did not save its results."); }'
